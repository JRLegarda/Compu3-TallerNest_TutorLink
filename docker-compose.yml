services:
  db:
    image: postgres:14.3
    container_name: tutorlink_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Volumen con nombre: los datos viven en Docker, no dentro del repo
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: tutorlink_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro de la red de Docker la BD se llama "db", NO "localhost".
      # Estas dos líneas pisan lo que diga el .env.
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "9000:9000"

volumes:
  pgdata:
