name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint

      - name: Unit tests + coverage (fails under 80%)
        run: npm run test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tutorlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tutorlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_E2E: true
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tutorlink
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-jwt-secret' }}
      JWT_EXPIRES_IN: 1h
      ADMIN_EMAIL: ${{ vars.CI_ADMIN_EMAIL || 'admin@tutorlink.com' }}
      ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'Admin1234' }}
      ADMIN_FULL_NAME: Administrador TutorLink
      SEED_KEY: ${{ secrets.CI_SEED_KEY || 'ci-seed-key' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npm run test:e2e

  deploy:
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Avisarle a Render que despliegue
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}